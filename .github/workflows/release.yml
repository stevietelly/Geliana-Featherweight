# Publishes a distributable Windows binary when a pull request is merged.
#
# Closing a PR without merging does nothing; merging one runs the test suite,
# builds the optimized release binary, packages it into a zip with the
# license/readme, and attaches it to a GitHub release tagged after the
# version in Cargo.toml (e.g. v0.1.0). If that tag already exists, the short
# commit hash is appended so successive merges still release.

name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    # Only actually-merged PRs produce a release.
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      # The pull_request closed event checks out a throwaway merge ref;
      # pin to the commit that landed on the default branch so the release
      # tag points at real history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json).packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Determine the release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            $tag = "$tag-$('${{ github.sha }}'.Substring(0, 8))"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package the distribution zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/GelianaFeatherweight.exe dist/
          Copy-Item LICENSE dist/
          Copy-Item Readme.md dist/
          Compress-Archive -Path dist/* `
            -DestinationPath "GelianaFeatherweight-${{ steps.tag.outputs.tag }}-x64.zip"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" `
            "GelianaFeatherweight-${{ steps.tag.outputs.tag }}-x64.zip" `
            --target "${{ github.event.pull_request.merge_commit_sha }}" `
            --title "Featherweight ${{ steps.tag.outputs.tag }}" `
            --notes ("Binary for PR #" + "${{ github.event.pull_request.number }}" + ": " +
              "${{ github.event.pull_request.title }}" + "`n`n" +
              "Commit: ${{ github.event.pull_request.merge_commit_sha }}`n" +
              "Run the exe directly — no console window, no installer needed.")
