[package]
name = "Featherweight"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Stephen Telian", "Geliana"]
description = "A Resource Efficient Screen Capture for windows Designed to work in the background while you game."
homepage = "https://geliana.com/featherweight"
documentation = "https://featherweight.geliana.com"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
winit = "0.30.13"
tray-icon = "0.26.1"
windows-capture = "2.0.1"
png = "0.18.1"
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Memory"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
directories = "6.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
rfd = "0.18.0"
tempfile = "3.27.0"

nnnoiseless = { version = "0.5.2", default-features = false }

[build-dependencies]
winresource = "0.1.34"
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"